<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ElectroWizard Dashboard</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>⚡ ElectroWizard – Outage Impact Dashboard</h1>

<div class="controls">
    <label>Start Node:</label>
    <input type="text" id="startNode" value="Sub_A">

    <label>Duration (hours):</label>
    <input type="number" id="hours" value="8">

    <button onclick="runAnalysis()">Run Analysis</button>
</div>

<h2>🗺️ Infrastructure Impact Map</h2>
<div id="map"></div>

<h2>🚑 Restoration Priority</h2>
<table id="priorityTable">
    <thead>
        <tr>
            <th>Rank</th>
            <th>Asset</th>
            <th>Severity</th>
            <th>Priority Score</th>
            <th>Cause Chain</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<h2>📊 Severity Overview</h2>
<canvas id="severityChart" height="120"></canvas>

<h2>⏱ Failure Timeline</h2>
<table id="timelineTable">
    <thead>
        <tr>
            <th>Time (hr)</th>
            <th>Asset</th>
            <th>Event</th>
            <th>Cause</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
